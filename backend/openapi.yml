openapi: 3.0.3
info:
  title: OilOwl API
  version: 1.0.0
paths:
  /api/assignments:
    get:
      operationId: assignments_list
      description: CRUD completo estándar. Los catálogos se desactivan en lugar de
        borrarse.
      parameters:
      - in: query
        name: attendant
        schema:
          type: string
          format: uuid
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: date__gte
        schema:
          type: string
          format: date
      - in: query
        name: date__lte
        schema:
          type: string
          format: date
      - in: query
        name: island
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: shift_template
        schema:
          type: string
          format: uuid
      tags:
      - assignments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
    post:
      operationId: assignments_create
      description: CRUD completo estándar. Los catálogos se desactivan en lugar de
        borrarse.
      tags:
      - assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/assignments/{id}:
    get:
      operationId: assignments_retrieve
      description: CRUD completo estándar. Los catálogos se desactivan en lugar de
        borrarse.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este assignment.
        required: true
      tags:
      - assignments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
    put:
      operationId: assignments_update
      description: CRUD completo estándar. Los catálogos se desactivan en lugar de
        borrarse.
      parameters:
      - in: path
        name: id
