components:
  schemas:
    Assignment:
      type: object
      description: 'Serializer estándar: los campos de auditoría siempre son de solo
        lectura.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        attendant_name:
          type: string
          readOnly: true
        island_name:
          type: string
          readOnly: true
        shift_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        date:
          type: string
          format: date
          title: Fecha
        notes:
          type: string
          maxLength: 255
        created_by:
          type: integer
          readOnly: true
          nullable: true
        updated_by:
          type: integer
          readOnly: true
          nullable: true
        shift_template:
          type: string
          format: uuid
          title: Turno
        island:
          type: string
          format: uuid
          title: Isla
        attendant:
          type: string
          format: uuid
          title: Bombero
      required:
      - attendant
      - attendant_name
      - created_at
      - created_by
      - date
      - id
      - island
      - island_name
      - shift_name
      - shift_template
      - updated_at
      - updated_by
    AssignmentRequest:
      type: object
      description: 'Serializer estándar: los campos de auditoría siempre son de solo
        lectura.'
      properties:
        date:
          type: string
          format: date
          title: Fecha
        notes:
          type: string
          maxLength: 255
        shift_template:
          type: string
          format: uuid
          title: Turno
        island:
          type: string
          format: uuid
          title: Isla
        attendant:
          type: string
          format: uuid
          title: Bombero
      required:
      - attendant
      - date
      - island
      - shift_template
    Attendant:
      type: object
      description: Campos que se fijan al crear y no se pueden cambiar después (`immutable_fields`).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Código
        name:
          type: string
          title: Nombre
          maxLength: 120
        is_active:
          type: boolean
          title: Activo
        national_id:
          type: string
          title: Cédula
        phone:
          type: string
          title: Teléfono
        created_by:
          type: integer
          readOnly: true
          nullable: true
        updated_by:
          type: integer
          readOnly: true
          nullable: true
        station:
          type: string
          format: uuid
          title: Estación
      required:
      - code
      - created_at
      - created_by
      - id
      - name
      - station
      - updated_at
      - updated_by
    AttendantRequest:
      type: object
      description: Campos que se fijan al crear y no se pueden cambiar después (`immutable_fields`).
      properties:
        name:
          type: string
          minLength: 1
          title: Nombre
          maxLength: 120
        is_active:
          type: boolean
          title: Activo
        national_id:
          type: string
          title: Cédula
        phone:
          type: string
          title: Teléfono
        station:
          type: string
          format: uuid
          title: Estación
      required:
      - name
      - station
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        ts:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          maxLength: 32
        app_label:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 64
        object_id:
          type: string
          maxLength: 64
        object_repr:
          type: string
          maxLength: 255
        station_id:
          type: string
          format: uuid
          nullable: true
        before:
          nullable: true
        after:
          nullable: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 255
        user:
          type: integer
          nullable: true
      required:
      - action
      - app_label
      - id
      - model
      - object_id
      - ts
      - username
    ChainVerification:
      type: object
      properties:
        valid:
          type: boolean
        checked:
          type: integer
        broken_at:
          type: string
          nullable: true
        chain_seq:
          type: integer
          nullable: true
        problem:
          type: string
          nullable: true
        head:
          type: string
      required:
      - broken_at
      - chain_seq
      - checked
      - problem
      - valid
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - current_password
      - new_password
    Closure:
      type: object
      description: 'Serializer estándar: los campos de auditoría siempre son de solo
        lectura.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        readings:
          type: array
          items:
            $ref: '#/components/schemas/MeterReading'
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ClosureLine'
          readOnly: true
        method_totals:
          type: array
          items:
            $ref: '#/components/schemas/MethodTotal'
          readOnly: true
        island_name:
          type: string
          readOnly: true
        attendant_name:
          type: string
          readOnly: true
        shift_date:
          type: string
          format: date
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Estado
        locked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        prev_hash:
          type: string
          readOnly: true
        content_hash:
          type: string
          readOnly: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          readOnly: true
          title: Tasa Bs/USD
        expected_liters:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        expected_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        expected_ves:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        declared_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        declared_ves:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        diff_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        diff_ves:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        diff_liters:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          readOnly: true
        notes:
          type: string
          readOnly: true
          title: Observaciones
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        chain_seq:
          type: integer
          readOnly: true
          nullable: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        updated_by:
          type: integer
          readOnly: true
          nullable: true
        locked_by:
          type: integer
          readOnly: true
          nullable: true
        station:
          type: string
          format: uuid
          readOnly: true
          title: Estación
        shift:
          type: string
          format: uuid
          readOnly: true
          title: Jornada
        island:
          type: string
          format: uuid
          readOnly: true
          title: Isla
        attendant:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          title: Bombero
        submitted_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - attendant
      - attendant_name
      - chain_seq
      - content_hash
      - created_at
      - created_by
      - declared_usd
      - declared_ves
      - diff_liters
      - diff_usd
      - diff_ves
      - expected_liters
      - expected_usd
      - expected_ves
      - id
      - island
      - island_name
      - lines
      - locked_at
      - locked_by
      - method_totals
      - notes
      - prev_hash
      - rate
      - readings
      - result
      - shift
      - shift_date
      - station
      - status
      - submitted_at
      - submitted_by
      - updated_at
      - updated_by
    ClosureAdjustment:
      type: object
      description: 'Serializer estándar: los campos de auditoría siempre son de solo
