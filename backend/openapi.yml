      description: CRUD completo estándar. Los catálogos se desactivan en lugar de
        borrarse.
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          title: Moneda
          enum:
          - USD
          - VES
        description: |-
          * `VES` - Bolívares
          * `USD` - Dólares
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          title: Tipo
          enum:
          - BILL
          - COIN
        description: |-
