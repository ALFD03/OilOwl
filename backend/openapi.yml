        schema:
          type: string
      - in: query
        name: station_id
        schema:
          type: string
          format: uuid
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
