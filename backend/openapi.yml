  /api/audit-logs:
    get:
      operationId: audit_logs_list
      description: Publica el usuario autenticado en el contexto (autoría y auditoría).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: app_label
        schema:
          type: string
      - in: query
        name: model
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
