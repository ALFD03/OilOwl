  /api/closures:
    get:
      operationId: closures_list
      description: Cierre de caja por isla. Los montos siempre se calculan en el servidor.
      parameters:
      - in: query
        name: attendant
        schema:
          type: string
          format: uuid
      - in: query
        name: island
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: result
        schema:
          type: string
          enum:
          - EXACT
          - OVER
          - SHORT
        description: |-
          * `EXACT` - Cuadrado
          * `OVER` - Sobrante
          * `SHORT` - Faltante
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: shift
        schema:
          type: string
          format: uuid
      - in: query
        name: shift__date
        schema:
          type: string
          format: date
      - in: query
        name: shift__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: shift__date__lte
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
          title: Estado
          enum:
          - DRAFT
          - LOCKED
          - SUBMITTED
        description: |-
          * `DRAFT` - Borrador
          * `SUBMITTED` - Enviado
          * `LOCKED` - Bloqueado
      tags:
      - closures
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClosureListList'
          description: ''
    post:
      operationId: closures_create
      description: Cierre de caja por isla. Los montos siempre se calculan en el servidor.
      tags:
      - closures
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenClosureRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Closure'
          description: ''
