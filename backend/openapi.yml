          description: ''
  /api/auth/change-password:
    post:
      operationId: auth_change_password_create
      description: Publica el usuario autenticado en el contexto (autoría y auditoría).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Se enruta fuera de la transacción de la petición (ver config/urls.py): el contador de
        intentos fallidos debe persistir aunque la respuesta sea un error.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me:
